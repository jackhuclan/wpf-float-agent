name: publish-nuget

# 每次推送到 main 或手动触发时：打包 NuGet 并发布到 GitHub Packages
# （同版本重复发布会自动跳过，因此只有升了版本号的提交才会产生新包）

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  pack-and-publish:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # IncludeSourceRevisionInInformationalVersion 需要 git 历史

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack FloatAgent / FloatAgent.Abstractions
        run: |
          dotnet pack src/FloatAgent.Abstractions/FloatAgent.Abstractions.csproj `
            -c Release -o artifacts --nologo
          dotnet pack src/FloatAgent/FloatAgent.csproj `
            -c Release -o artifacts --nologo
        shell: pwsh

      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source `
            --username jackhuclan `
            --password ${{ secrets.GITHUB_TOKEN }} `
            --store-password-in-clear-text `
            --name github `
            "https://nuget.pkg.github.com/jackhuclan/index.json"
        shell: pwsh

      - name: Push to GitHub Packages
        shell: pwsh
        run: |
          # pwsh 不展开通配符，dotnet nuget push 也不支持 glob——显式枚举逐个推送
          Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name)"
            dotnet nuget push $_.FullName --source github --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
